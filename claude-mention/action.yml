name: 'Claude Mention'
description: >-
  Run Claude Code in TAG mode in response to an @claude mention, collect the
  transcript, and fail the check when a tool call was denied.

# >>> THIS ACTION SUPPLIES NO `prompt`, AND THAT IS THE WHOLE POINT. <<<
# Supplying a `prompt` puts claude-code-action in AGENT mode for every event it sees.
# In agent mode an @claude comment gets no PR context, no tracking comment, and nothing
# posted back. No prompt means TAG mode, where Claude performs the instructions in the
# comment that tagged it. This is why this action and claude-pr-review cannot be one
# thing, however similar they look.
#
# The 👀 reaction on an @claude comment comes from the GitHub App acknowledging the
# mention. It is NOT evidence that anything ran -- the work happens here.
#
# >>> THE CALLER OWNS THE TRIGGER GUARD. <<<
# This action does not and cannot check who triggered it: by the time a composite
# action runs, the runner is already up. On a PUBLIC repository the caller MUST gate
# the job on author_association, because this job is given `contents: write` and
# blanket `Bash`. See examples/claude-mention-public.yml and README.md.

inputs:
  claude_code_oauth_token:
    description: 'Claude Code OAuth token. Generate with `claude setup-token`.'
    required: true
  allowed_tools:
    description: >-
      Tools to ADD to tag mode's base set. Unlike agent mode, tag mode merges this with
      its own list (Read/Glob/Grep/LS, the comment-update tool, the three
      mcp__github_ci__* tools, and git add/commit/push/rm), so this is only the extras.
      Naming an mcp__github_* tool here is also what installs that MCP server.
      WebSearch and WebFetch are disallowed by default in tag mode; listing them lifts
      that.
    required: false
    default: 'mcp__github_inline_comment__create_inline_comment,Read,Glob,Grep,Edit,Write,Task,Skill,TodoWrite,WebSearch,WebFetch,Bash'
  retention_days:
    description: 'Retention for the log artifact. These are world-readable on a public repo.'
    required: false
    default: '14'

outputs:
  ran:
    description: '"true" when the agent actually started (i.e. produced an execution file).'
    value: ${{ steps.stats.outputs.ran }}

runs:
  using: composite
  steps:
    # NOTE: the CALLER checks out -- see the same note in claude-pr-review/action.yml.

    - name: Run Claude Code
      id: claude
      uses: anthropics/claude-code-action@v1
      with:
        claude_code_oauth_token: ${{ inputs.claude_code_oauth_token }}

        # Lets Claude read CI results on PRs. It is also what makes the three
        # mcp__github_ci__* tools available -- tag mode adds them to the allowlist on
        # its own, so they are not in the default `allowed_tools` above.
        additional_permissions: |
          actions: read

        # No `prompt:` on purpose -- see the header. That is what keeps this in tag
        # mode, where Claude performs the instructions in the comment that tagged it.

        # Without these the log shows only "init" and "result". On a public repository
        # the job log and the artifact below are world-readable, so this is a deliberate
        # trade: without them, a run that was starved by a denied tool call is
        # indistinguishable from one that had nothing to do.
        display_report: true
        show_full_output: true

        # >>> Do not go back to an enumerated command allowlist. <<<
        # Listing individual Bash commands (puppet-lint, nox, poetry, ./bin/run_tests.sh)
        # is how these runs get starved: anything unlisted is a SILENT denial, so the run
        # goes green having done nothing. `Skill` and `Task` matter for the same reason --
        # a skill or a subagent that cannot be invoked is not an error, just an absence.
        claude_args: |
          --allowedTools "${{ inputs.allowed_tools }}"

    # The action discards its transcript with the runner. Without this there is no way
    # to explain a green run that did nothing.
    - name: Collect Claude logs
      if: always()
      shell: bash
      env:
        EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
      run: |
        mkdir -p "$RUNNER_TEMP/claude-logs"
        if [ -n "$EXECUTION_FILE" ] && [ -f "$EXECUTION_FILE" ]; then
          cp "$EXECUTION_FILE" "$RUNNER_TEMP/claude-logs/execution-output.json"
        fi
        if [ -d "$HOME/.claude/projects" ]; then
          cp -r "$HOME/.claude/projects" "$RUNNER_TEMP/claude-logs/sessions"
        fi
        find "$RUNNER_TEMP/claude-logs" -type f -printf '%s\t%p\n' | sort -rn

    - name: Upload Claude logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: claude-mention-logs-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/claude-logs/
        if-no-files-found: warn
        retention-days: ${{ inputs.retention_days }}

    # Same guard as claude-pr-review: a denied tool call is how one of these jobs passes
    # while having done nothing. There is no comment to annotate here -- in tag mode the
    # action maintains its own tracking comment -- so the numbers go to the job summary
    # and a denial fails the check.
    - name: Summarise the run and fail on permission denials
      id: stats
      if: always()
      shell: bash
      env:
        EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
      run: |
        set -uo pipefail

        if [ -z "${EXECUTION_FILE:-}" ] || [ ! -s "$EXECUTION_FILE" ]; then
          echo "ran=false" >> "$GITHUB_OUTPUT"
          echo "::warning title=Claude did not run::No execution file was produced, so the agent never started. Expected if this PR edits .github/workflows/claude-*.yml (workflow validation skip)."
          exit 0
        fi

        RESULT=$(jq -c '[.[] | select(.type == "result")] | last // empty' "$EXECUTION_FILE")
        if [ -z "$RESULT" ]; then
          echo "ran=false" >> "$GITHUB_OUTPUT"
          echo "::warning title=No result block::The execution file exists but contains no result object."
          exit 0
        fi

        DURATION_MS=$(jq -r '.duration_ms // 0' <<<"$RESULT")
        TURNS=$(jq -r '.num_turns // 0' <<<"$RESULT")
        COST=$(jq -r '.total_cost_usd // 0' <<<"$RESULT")
        DENIALS=$(jq -r '.permission_denials_count // 0' <<<"$RESULT")
        IS_ERROR=$(jq -r '.is_error // false' <<<"$RESULT")

        HUMAN=$(awk -v ms="$DURATION_MS" 'BEGIN {
          s = int(ms / 1000)
          if (s < 60) { printf "%ds", s } else { printf "%dm %ds", int(s / 60), s % 60 }
        }')
        COST_FMT=$(awk -v c="$COST" 'BEGIN { printf "%.4f", c }')

        echo "ran=true" >> "$GITHUB_OUTPUT"

        {
          echo "### Claude (@mention)"
          echo
          echo "| | |"
          echo "|---|---|"
          echo "| Duration | $HUMAN |"
          echo "| Turns | $TURNS |"
          echo "| Cost | \$$COST_FMT |"
          echo "| Permission denials | $DENIALS |"
        } >> "$GITHUB_STEP_SUMMARY"

        STATUS=0
        if [ "$DENIALS" != "0" ]; then
          echo "::error title=Claude was denied $DENIALS tool call(s)::A denied tool means the run was starved, even though it exited cleanly. Add the missing tool to allowed_tools. See the claude-mention-logs-* artifact."
          STATUS=1
        fi
        if [ "$IS_ERROR" = "true" ]; then
          echo "::error title=Claude reported an error::The run's result block has is_error=true."
          STATUS=1
        fi
        exit $STATUS
