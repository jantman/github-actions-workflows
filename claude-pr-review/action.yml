name: 'Claude PR Review'
description: >-
  Run a Claude Code review of a pull request and post it as ONE GitHub review
  with the run's cost in the body. Fails the check when a tool call was denied.

# >>> A GREEN RUN IS NOT EVIDENCE THAT A REVIEW HAPPENED. <<<
# This whole action exists because that sentence was false-looking-true for months.
# `/code-review:code-review` is a SKILL; with `Skill` missing from the allowlist the
# action denied it, improvised the plugin's steps by hand, ended the turn and exited 0.
# The only trace was `permission_denials_count: 1` in a result block that
# `display_report: false` kept out of the log. Everything here that looks like
# belt-and-braces is there because of that.
#
# >>> THE AGENT DOES NOT POST TO GITHUB. THIS ACTION DOES. <<<
# The plugin's `--comment` mode posts each finding as a standalone inline comment and
# posts a summary ONLY when it finds nothing -- upstream's inline-comment MCP server
# exists precisely so the agent cannot reach the review API. That leaves a review with
# findings as N ungrouped comments and no top-level body to hang a cost footer off.
# So `--comment` is deliberately NOT passed: the agent writes findings to a JSON file
# and "Post the review" turns them into one `POST /pulls/N/reviews`.
#
# See README.md for the caller-side contract, the two guards that must stay in the
# caller workflow, and why a change here IS testable by its own PR (unlike a change to
# a caller workflow, which is not).

inputs:
  claude_code_oauth_token:
    description: 'Claude Code OAuth token. Generate with `claude setup-token`.'
    required: true
  github_token:
    description: >-
      Token used to POST the review. Needs `pull-requests: write`. The default is the
      job's GITHUB_TOKEN, which is what you want -- the action revokes its own GitHub
      App token in an `if: always()` step before this action's later steps run, which
      is why the review is authored by github-actions[bot] and not claude[bot].
    required: false
    default: ${{ github.token }}
  allowed_tools:
    description: >-
      The COMPLETE --allowedTools list. Agent mode does not merge a base set into this,
      so anything absent here is absent from the run. Override only to add; removing
      Skill, Task or Write breaks the review in ways that still exit 0.
    required: false
    default: 'mcp__github_inline_comment__create_inline_comment,mcp__github_ci__get_ci_status,mcp__github_ci__get_workflow_run_details,mcp__github_ci__download_job_log,Read,Glob,Grep,Task,Skill,TodoWrite,Write,Bash'
  prompt_extra:
    description: >-
      Extra instructions appended to the review prompt, for repo-specific review focus.
      Appended AFTER the findings-file contract, so it cannot dislodge it.
    required: false
    default: ''
  retention_days:
    description: 'Retention for the log artifact. These are world-readable on a public repo.'
    required: false
    default: '14'
  claude_avatar:
    description: 'Avatar used in the review heading and job summary.'
    required: false
    default: 'https://avatars.githubusercontent.com/u/81847?s=40&v=4'

outputs:
  ran:
    description: '"true" when the agent actually started (i.e. produced an execution file).'
    value: ${{ steps.stats.outputs.ran }}
  cost:
    description: 'Total cost in USD, formatted to 4dp. Empty when the agent did not run.'
    value: ${{ steps.stats.outputs.cost }}
  denials:
    description: 'permission_denials_count from the result block.'
    value: ${{ steps.stats.outputs.denials }}
  review_url:
    description: 'html_url of the review that was posted, when one was.'
    value: ${{ steps.post.outputs.review_url }}

runs:
  using: composite
  steps:
    - name: Set up the hand-off paths
      shell: bash
      env:
        AVATAR: ${{ inputs.claude_avatar }}
      run: |
        # The hand-off between the agent and this action. It lives in the workspace,
        # not under RUNNER_TEMP: RUNNER_TEMP is a sibling of the checkout rather than a
        # descendant, so writing there is outside the agent's working directory and
        # needs an --add-dir it does not have. The workspace is where the agent already is.
        {
          echo "FINDINGS_FILE=${GITHUB_WORKSPACE}/.claude-review-findings.json"
          echo "CLAUDE_AVATAR=${AVATAR}"
        } >> "$GITHUB_ENV"

    # NOTE: the CALLER checks out. This action does not, on purpose -- `uses: ./...`
    # only resolves once the workspace exists, so a composite that checked itself out
    # could never be referenced by a local path, and this repository could not run its
    # own actions against a PR's copy of them. It also leaves fetch-depth, submodules
    # and LFS to the caller, which knows what the repository needs.

    - name: Run Claude Code Review
      id: claude-review
      uses: anthropics/claude-code-action@v1
      with:
        claude_code_oauth_token: ${{ inputs.claude_code_oauth_token }}
        plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
        plugins: 'code-review@claude-code-plugins'
        # Note the absence of `--comment`: see the header. Without it the plugin stops
        # at its step 7 having posted nothing, which is exactly what we want -- the
        # findings come out through the JSON file instead.
        prompt: |
          /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

          Override to step 1: do NOT stop because Claude has already commented on
          this pull request. Earlier Claude reviews are expected here and are not a
          reason to skip. The other step 1 stop conditions (closed, draft, trivial)
          still apply.

          If Claude has commented or reviewed before, scope this review to the
          commits pushed since Claude's most recent review rather than the whole PR
          diff, and do not re-raise an issue that a previous review already covers.

          Your own earlier reviews are NOT authored by `claude[bot]`. This workflow
          submits them on your behalf, so they come from `github-actions[bot]` --
          which in this repository may also author other bot comments that are not
          yours. Find your previous reviews by their marker instead:

              gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews" \
                --jq '.[] | select(.body | contains("<!-- claude-code-review -->")) | {submitted_at, body}'

          and their inline comments with `gh api .../pulls/<n>/comments`.

          DO NOT POST ANYTHING TO GITHUB YOURSELF. No `gh pr comment`, no
          `gh api .../reviews`, and no inline comments -- not even if you think the
          findings would otherwise be lost. `--comment` is omitted on purpose. A
          later step of this workflow collects what you write below into a single
          GitHub review, so that the findings arrive together and carry the run's
          cost footer. Anything you post directly is a duplicate.

          Instead, as the very last thing you do, use the Write tool to write your
          findings to this exact path:

              ${{ env.FINDINGS_FILE }}

          It must be valid JSON matching this schema exactly:

              {
                "verdict": "reviewed" | "skipped",
                "skip_reason": "<one line, no newlines; why you stopped. Only when verdict is skipped>",
                "summary": "<markdown, 1-3 sentences: what this PR does and the bottom line of the review>",
                "findings": [
                  {
                    "path": "<repo-relative file path, exactly as it appears in the diff>",
                    "line": <integer line number in the file AFTER the change>,
                    "start_line": <integer, optional, only for a multi-line finding; must be less than "line">,
                    "body": "<markdown -- the same content you would have put in an inline comment>"
                  }
                ]
              }

          Rules for that file:

          - Write it ALWAYS, including when step 1 tells you to stop. In that case
            set "verdict" to "skipped", give a "skip_reason", and use an empty
            "findings" array. Writing this file is the one thing that must happen
            on every path through the command, including the ones that say "stop".
          - "findings" is always present. Use [] when you found nothing; that is a
            clean review, not a skipped one.
          - "line" is a JSON number, not a string, and "body" is a non-empty string.
          - Comment only on ADDED or CHANGED lines, never on a deleted one. "line"
            MUST be a line the diff actually touches and "path" MUST be a file the
            diff actually changes, both as they are AFTER the change. GitHub
            rejects a review comment anywhere else, and it rejects the WHOLE review
            when one comment is bad, so a sloppy line number costs every other
            finding too. If a finding genuinely has no line to sit on, leave "line"
            out entirely -- it will be reported in the review body instead, which
            is much better than taking the rest of the review down with it.
          - "body" follows the command's normal inline-comment rules: brief
            description, a committable suggestion block only when committing it
            fixes the issue entirely, and cited links in the full-SHA
            https://github.com/owner/repo/blob/<sha>/path#L4-L7 form.

          This is a non-interactive CI run. Nothing will resume the session once
          you produce a final message, so do not launch background or async agents
          and do not schedule a wakeup -- run subagents synchronously and wait for
          each result. The findings file must be written before you finish the turn.

          ${{ inputs.prompt_extra }}
        # Without these the log shows only "init" and "result" -- minutes of invisible
        # work and a bare permission_denials_count when it goes wrong. On a public
        # repository the job log and the artifact below are world-readable, so this is
        # a deliberate trade: the transcript of a review of an already-public diff is
        # worth far less than being able to tell a real review from a starved one.
        display_report: true
        show_full_output: true
        claude_args: |
          --allowedTools "${{ inputs.allowed_tools }}"

    # The action writes its transcript under the runner temp dir and throws it away
    # with the runner. Without this there is no way to find out why a run posted nothing.
    - name: Collect Claude logs
      if: always()
      shell: bash
      env:
        EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
      run: |
        mkdir -p "$RUNNER_TEMP/claude-logs"
        if [ -n "$EXECUTION_FILE" ] && [ -f "$EXECUTION_FILE" ]; then
          cp "$EXECUTION_FILE" "$RUNNER_TEMP/claude-logs/execution-output.json"
        fi
        if [ -f "$FINDINGS_FILE" ]; then
          cp "$FINDINGS_FILE" "$RUNNER_TEMP/claude-logs/review-findings.json"
        fi
        if [ -d "$HOME/.claude/projects" ]; then
          cp -r "$HOME/.claude/projects" "$RUNNER_TEMP/claude-logs/sessions"
        fi
        find "$RUNNER_TEMP/claude-logs" -type f -printf '%s\t%p\n' | sort -rn

    - name: Upload Claude logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: claude-pr-review-logs-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/claude-logs/
        if-no-files-found: warn
        retention-days: ${{ inputs.retention_days }}

    # What the run actually cost and whether anything was denied. The action reports
    # none of this anywhere a human looks.
    - name: Summarise the run
      id: stats
      if: always()
      shell: bash
      env:
        EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
      run: |
        set -uo pipefail

        if [ -z "${EXECUTION_FILE:-}" ] || [ ! -s "$EXECUTION_FILE" ]; then
          # No execution file means the agent never started. The usual cause is benign
          # and expected: the action skips when the CALLER's workflow file differs from
          # the copy on the default branch, which is every PR that edits it. Warn rather
          # than fail, or such a PR could never be green.
          echo "ran=false" >> "$GITHUB_OUTPUT"
          echo "::warning title=Claude review did not run::No execution file was produced, so the agent never started. If this PR edits .github/workflows/claude-*.yml that is expected (workflow validation skip). Otherwise, check the job log."
          {
            echo "### <img src=\"$CLAUDE_AVATAR\" alt=\"\" width=\"16\" height=\"16\" align=\"top\"> Claude review did not run"
            echo
            echo "No execution file was produced, so the agent never started."
            echo "Expected when this PR edits the Claude workflows; otherwise look for"
            echo '`Exiting due to workflow validation skip` in the job log.'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        # The file is a JSON array of streamed messages; the stats live in the last
        # object of type "result".
        RESULT=$(jq -c '[.[] | select(.type == "result")] | last // empty' "$EXECUTION_FILE")
        if [ -z "$RESULT" ]; then
          echo "ran=false" >> "$GITHUB_OUTPUT"
          echo "::warning title=Claude review produced no result block::The execution file exists but contains no result object."
          exit 0
        fi

        DURATION_MS=$(jq -r '.duration_ms // 0' <<<"$RESULT")
        TURNS=$(jq -r '.num_turns // 0' <<<"$RESULT")
        COST=$(jq -r '.total_cost_usd // 0' <<<"$RESULT")
        DENIALS=$(jq -r '.permission_denials_count // 0' <<<"$RESULT")
        IS_ERROR=$(jq -r '.is_error // false' <<<"$RESULT")

        HUMAN=$(awk -v ms="$DURATION_MS" 'BEGIN {
          s = int(ms / 1000)
          if (s < 60) { printf "%ds", s } else { printf "%dm %ds", int(s / 60), s % 60 }
        }')
        COST_FMT=$(awk -v c="$COST" 'BEGIN { printf "%.4f", c }')

        {
          echo "ran=true"
          echo "duration=$HUMAN"
          echo "turns=$TURNS"
          echo "cost=$COST_FMT"
          echo "denials=$DENIALS"
          echo "is_error=$IS_ERROR"
        } >> "$GITHUB_OUTPUT"

        {
          # 16px, not the review body's 20px: an `h3` renders at 17.5px to the `h2`'s
          # 21px, and an icon taller than its heading reads as a bullet.
          echo "### <img src=\"$CLAUDE_AVATAR\" alt=\"\" width=\"16\" height=\"16\" align=\"top\"> Claude review"
          echo
          echo "| | |"
          echo "|---|---|"
          echo "| Duration | $HUMAN |"
          echo "| Turns | $TURNS |"
          echo "| Cost | \$$COST_FMT |"
          echo "| Permission denials | $DENIALS |"
          echo
          if [ "$DENIALS" != "0" ]; then
            echo "**$DENIALS tool call(s) were denied.** A denied \`Skill\` or \`Task\` means the"
            echo "review silently improvised or did not happen at all. Download the"
            echo "\`claude-pr-review-logs-*\` artifact and grep the transcript for the denial."
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    # Turn the agent's findings into ONE GitHub review, with the run's cost in the
    # body. See the header for why the agent does not do this itself.
    - name: Post the review
      id: post
      if: always() && steps.stats.outputs.ran == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        SERVER_URL: ${{ github.server_url }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        WORKFLOW_NAME: ${{ github.workflow }}
        EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        DURATION: ${{ steps.stats.outputs.duration }}
        TURNS: ${{ steps.stats.outputs.turns }}
        COST: ${{ steps.stats.outputs.cost }}
        DENIALS: ${{ steps.stats.outputs.denials }}
      run: |
        set -uo pipefail

        # A hidden marker, so a later run can find this run's review. Nothing the agent
        # produces is attributable to it any more -- the review is submitted as
        # github-actions[bot], which may also author other bot comments in the calling
        # repository -- and the prompt tells the agent to look for this string when
        # scoping an incremental review. Keep it byte-identical across repositories and
        # across versions of this action; it is a contract, not a label.
        MARKER="<!-- claude-code-review -->"

        # Every review body starts with this, so that a reader who sees
        # `github-actions[bot]` in the author slot is told immediately whose review this
        # actually is. Four places below build a body -- normal, skipped,
        # inline-rejected fallback, unusable hand-off -- and all go through here.
        #
        # Three things about this line are deliberate, and all three were checked by
        # rendering through `POST /markdown` rather than guessed:
        #
        #   - GitHub's sanitiser keeps `img` with src/alt/width/height/align and wraps
        #     it in a link to itself; `style` would be stripped, so the sizing has to be
        #     attributes. 20px suits an `h2`, which renders at 21px here. `alt` is empty
        #     on purpose -- it is decorative, and the heading already says Claude.
        #   - The attribution lives INSIDE the `##`, after an explicit `<br>`. Inside,
        #     because GitHub gives `h2` a bottom border and the line belongs above that
        #     rule rather than orphaned below it. After a `<br>`, because it is a caption
        #     under the heading, not a continuation of it. Writing it as a second `echo`
        #     puts it below the rule AND splits the sentence with a stray `<br>`, since a
        #     single newline is a hard break in GitHub's markdown.
        #   - `<sub>` is nested because `sub` is 0.75em of its parent: one level off a
        #     21px `h2` is louder than the body text it is meant to whisper under. Two
        #     levels lands at ~12px.
        #   - The wording is short on purpose. The comment column is ~780px on a
        #     maximised window and narrower on a laptop, and this renders at ~680px.
        #     Anything longer wraps and strands a word, which is what the `<br>` exists
        #     to prevent. Measured in a real PR comment, not guessed.
        emit_header() {
          echo "$MARKER"
          echo "## <img src=\"$CLAUDE_AVATAR\" alt=\"\" width=\"20\" height=\"20\" align=\"top\"> Claude Code review<br><sub><sub>From Claude, via the \`${WORKFLOW_NAME}\` workflow -- hence \`github-actions[bot]\`.</sub></sub>"
          echo
        }

        emit_footer() {
          echo
          echo "---"
          echo "<sub>$FOOTER</sub>"
        }

        FOOTER="🔎 ${DURATION} · ${TURNS} turns · \$${COST}"
        if [ "$DENIALS" != "0" ]; then
          FOOTER="${FOOTER} · ⚠️ ${DENIALS} permission denial(s)"
        fi
        FOOTER="${FOOTER} · [run log](${RUN_URL})"

        # `jq -e .` only proves the file parses. It does not prove the shape, and a
        # valid-JSON-wrong-shape file is the dangerous case: every `jq` below then fails
        # quietly (there is no `set -e` here, deliberately -- the fallback path depends
        # on running past a failed command), COUNT and OTHER come out as empty strings,
        # and the step posts a review claiming findings it does not show and exits 0.
        # That is precisely the "green having done nothing" failure this exists to
        # prevent, so the shape is checked up front.
        BAD=""
        if [ ! -s "$FINDINGS_FILE" ]; then
          BAD="it is missing or empty"
        elif ! jq -e . "$FINDINGS_FILE" > /dev/null 2>&1; then
          BAD="it is not valid JSON"
        elif ! jq -e 'type == "object" and ((.findings // []) | type == "array")' \
               "$FINDINGS_FILE" > /dev/null 2>&1; then
          BAD="it is not an object with an array \"findings\" key"
        fi

        if [ -n "$BAD" ]; then
          # Salvage what we can rather than leave the PR with nothing: the agent's final
          # message is in the execution file, and it contains the findings in prose even
          # when the JSON hand-off failed. Post that, then still fail, because a broken
          # contract must not be a green check.
          echo "::error title=Claude review findings file is unusable::The agent ran ($DURATION, \$$COST) but $BAD. Posting the agent's final message instead. The file and the transcript are in the claude-pr-review-logs-* artifact."

          FINAL=$(jq -r '[.[] | select(.type == "result")] | last | .result // ""' \
                    "$EXECUTION_FILE" 2>/dev/null)
          {
            emit_header
            echo "> [!WARNING]"
            echo "> The agent did not hand back usable findings ($BAD), so this is its"
            echo "> raw final message rather than a structured review. Nothing is inline."
            echo
            if [ -n "$FINAL" ]; then echo "$FINAL"; else echo "_The transcript has no final message either._"; fi
            emit_footer
          } > "$RUNNER_TEMP/review-body.md"

          jq -n --rawfile body "$RUNNER_TEMP/review-body.md" \
            '{event: "COMMENT", body: $body, comments: []}' \
            > "$RUNNER_TEMP/review-payload.json"
          gh api -X POST "repos/$REPO/pulls/$PR/reviews" \
            --input "$RUNNER_TEMP/review-payload.json" > /dev/null \
            || echo "::warning title=Salvage review could not be posted::Even the final-message review was rejected."
          exit 1
        fi

        VERDICT=$(jq -r '.verdict // "reviewed"' "$FINDINGS_FILE")
        SUMMARY=$(jq -r '.summary // ""' "$FINDINGS_FILE")

        # A deliberate skip (closed, draft, trivial) still posts a review, just a
        # one-liner. A run that decided not to review is still a run that cost money,
        # and leaving it visible only in the job summary is how a skip that should not
        # have happened stays invisible -- "skipped" is the agent's own judgement, and
        # nothing here can check it.
        if [ "$VERDICT" = "skipped" ]; then
          # Flattened: a newline in a workflow command truncates the annotation and
          # dumps the rest into the log as loose text.
          REASON=$(jq -r '.skip_reason // "no reason given"' "$FINDINGS_FILE" \
                     | tr '\n' ' ' | sed 's/[[:space:]]*$//')
          echo "::notice title=Claude review skipped this PR::$REASON"
          {
            echo
            echo "Review **skipped**: $REASON"
          } >> "$GITHUB_STEP_SUMMARY"

          {
            emit_header
            echo "**Skipped this pull request.** $REASON"
            emit_footer
          } > "$RUNNER_TEMP/review-body.md"

          jq -n --rawfile body "$RUNNER_TEMP/review-body.md" \
            '{event: "COMMENT", body: $body, comments: []}' \
            > "$RUNNER_TEMP/review-payload.json"
          if gh api -X POST "repos/$REPO/pulls/$PR/reviews" \
               --input "$RUNNER_TEMP/review-payload.json" > "$RUNNER_TEMP/resp-skip.json"; then
            URL=$(jq -r '.html_url' "$RUNNER_TEMP/resp-skip.json")
            echo "review_url=$URL" >> "$GITHUB_OUTPUT"
            echo "Posted skip review $URL."
          else
            echo "::warning title=Skip review could not be posted::The run was skipped ($REASON) but the one-line review was rejected. See the job log."
            cat "$RUNNER_TEMP/resp-skip.json"
          fi
          exit 0
        fi

        # A finding GitHub cannot place on the diff is still a finding, and an agent
        # that paid for four subagents to produce it should not have it thrown away over
        # a missing or mistyped key. Split rather than filter: the placeable ones become
        # inline comments, the rest get written into the review body.
        #
        # "Placeable" is a stricter test than "not null", because every one of these is
        # a 422 that takes the WHOLE batch down with it -- a `line` the agent quoted as
        # a string, an empty body, a start_line below its line.
        PLACEABLE='
          (.path | type) == "string" and (.path | length) > 0
          and (.line | type) == "number"
          and (.body | type) == "string" and (.body | length) > 0
          and ((.start_line // null) == null
               or ((.start_line | type) == "number" and .start_line < .line))
        '
        jq "[.findings // [] | .[] | select($PLACEABLE)]" \
          "$FINDINGS_FILE" > "$RUNNER_TEMP/findings-inline.json"
        jq "[.findings // [] | .[] | select($PLACEABLE | not)]" \
          "$FINDINGS_FILE" > "$RUNNER_TEMP/findings-unplaceable.json"
        jq '.findings // []' "$FINDINGS_FILE" > "$RUNNER_TEMP/findings-all.json"

        TOTAL=$(jq 'length' "$RUNNER_TEMP/findings-all.json")
        COUNT=$(jq 'length' "$RUNNER_TEMP/findings-inline.json")
        OTHER=$(jq 'length' "$RUNNER_TEMP/findings-unplaceable.json")
        if [ "$OTHER" -gt 0 ]; then
          echo "::warning title=Findings could not be placed inline::$OTHER of $TOTAL findings had no usable path, line or body, so they go in the review body instead of on a line."
        fi

        # Renders findings as markdown for the review body. Shared by the unplaceable
        # ones below and by the all-in-the-body fallback. Everything reaching it via the
        # first path has already failed the placeable test, so treat an empty string
        # exactly like a missing key -- `//` alone does not, and would emit an empty
        # heading, a blank body or a link to the repo root.
        RENDER_FINDINGS='
          def present(f): (f | type) == "string" and (f | length) > 0;
          def loc:
            if present(.path) | not then "Location not given"
            else "`\(.path)`" + (if (.line | type) == "number" then ":\(.line)" else "" end)
            end;
          def link:
            if present(.path) and (.line | type) == "number"
            then "\n\n<sub>[view](\($server)/\($repo)/blob/\($sha)/\(.path)#L\(.line))</sub>"
            else "" end;
          def text: if present(.body) then .body else "_(no description given)_" end;
          [ .[] | "### \(loc)\n\n\(text)\(link)" ] | join("\n\n")
        '

        if [ "$TOTAL" -eq 0 ]; then
          HEADLINE="No issues found. Checked for bugs and CLAUDE.md compliance."
        elif [ "$OTHER" -eq 0 ]; then
          HEADLINE="$TOTAL issue(s) flagged, inline below."
        elif [ "$COUNT" -eq 0 ]; then
          HEADLINE="$TOTAL issue(s) flagged. None of them could be placed on a line in the diff, so they are listed here."
        else
          HEADLINE="$TOTAL issue(s) flagged: $COUNT inline below, and $OTHER that could not be placed on a line, listed here."
        fi

        {
          emit_header
          [ -n "$SUMMARY" ] && { echo "$SUMMARY"; echo; }
          echo "$HEADLINE"
          if [ "$OTHER" -gt 0 ]; then
            echo
            jq -r --arg repo "$REPO" --arg sha "$HEAD_SHA" --arg server "$SERVER_URL" \
              "$RENDER_FINDINGS" "$RUNNER_TEMP/findings-unplaceable.json"
          fi
          emit_footer
        } > "$RUNNER_TEMP/review-body.md"

        jq -n \
          --rawfile body "$RUNNER_TEMP/review-body.md" \
          --slurpfile findings "$RUNNER_TEMP/findings-inline.json" \
          '{
             event: "COMMENT",
             body: $body,
             comments: ($findings[0] | map(
               {path: .path, body: .body, line: .line, side: "RIGHT"}
               + (if (.start_line // null) != null
                  then {start_line: .start_line, start_side: "RIGHT"}
                  else {} end)
             ))
           }' > "$RUNNER_TEMP/review-payload.json"

        if gh api -X POST "repos/$REPO/pulls/$PR/reviews" \
             --input "$RUNNER_TEMP/review-payload.json" \
             > "$RUNNER_TEMP/resp-batched.json" 2> "$RUNNER_TEMP/err-batched.txt"; then
          URL=$(jq -r '.html_url' "$RUNNER_TEMP/resp-batched.json")
          echo "review_url=$URL" >> "$GITHUB_OUTPUT"
          echo "Posted review $URL with $COUNT inline comment(s)."
          exit 0
        fi

        # Which comment GitHub objected to is the one thing worth knowing here, and it
        # is in the response body, not in the one-line error on stderr. Print both --
        # "Upload Claude logs" has already run, so the log is the only place this can
        # survive.
        echo "The batched review was rejected. GitHub said:"
        cat "$RUNNER_TEMP/err-batched.txt"
        jq -c '.' "$RUNNER_TEMP/resp-batched.json" 2>/dev/null || cat "$RUNNER_TEMP/resp-batched.json"

        # Only a 422 means "this comment cannot be placed". Anything else -- a 403 on a
        # fork PR, a 5xx, a dropped connection -- might well have created the review
        # server-side, and retrying would post it twice.
        if ! grep -q 'HTTP 422' "$RUNNER_TEMP/err-batched.txt"; then
          echo "::error title=Claude review could not be posted::GitHub rejected the review with something other than a 422, so it was not retried (a retry could double-post). See the job log for the response."
          exit 1
        fi

        # Batched review comments are all-or-nothing: one line GitHub will not accept
        # (usually a line the diff does not touch) rejects the entire review. Retry with
        # the findings in the body so they are not lost.
        echo "::warning title=Batched review comments were rejected::GitHub refused the review with $COUNT inline comment(s), most likely because a finding pointed at a line outside the diff. Retrying with the findings folded into the review body."

        jq -r --arg repo "$REPO" --arg sha "$HEAD_SHA" --arg server "$SERVER_URL" \
          "$RENDER_FINDINGS" "$RUNNER_TEMP/findings-all.json" > "$RUNNER_TEMP/findings-body.md"

        # A review body is capped at 65536 characters. Losing every finding to a second
        # 422 because the body ran long is a worse outcome than losing the tail of a
        # long one, so trim with a pointer to the artifact.
        if [ "$(wc -c < "$RUNNER_TEMP/findings-body.md")" -gt 60000 ]; then
          echo "::warning title=Findings truncated::The findings did not fit in a review body and were truncated. The full set is in the claude-pr-review-logs-* artifact."
          head -c 60000 "$RUNNER_TEMP/findings-body.md" > "$RUNNER_TEMP/findings-body.trimmed"
          {
            echo
            echo "_Truncated -- the findings exceeded GitHub's review body limit. The full set is in the \`claude-pr-review-logs-*\` artifact on [the run]($RUN_URL)._"
          } >> "$RUNNER_TEMP/findings-body.trimmed"
          mv "$RUNNER_TEMP/findings-body.trimmed" "$RUNNER_TEMP/findings-body.md"
        fi

        {
          emit_header
          [ -n "$SUMMARY" ] && { echo "$SUMMARY"; echo; }
          echo "$TOTAL issue(s) flagged. GitHub rejected them as inline comments, so they are listed here instead."
          echo
          cat "$RUNNER_TEMP/findings-body.md"
          emit_footer
        } > "$RUNNER_TEMP/review-body.md"

        jq -n --rawfile body "$RUNNER_TEMP/review-body.md" \
          '{event: "COMMENT", body: $body, comments: []}' \
          > "$RUNNER_TEMP/review-payload.json"

        if ! gh api -X POST "repos/$REPO/pulls/$PR/reviews" \
               --input "$RUNNER_TEMP/review-payload.json" > "$RUNNER_TEMP/resp-fallback.json"; then
          echo "::error title=Claude review could not be posted::Both the batched and the body-only review were rejected by GitHub. The findings are in the claude-pr-review-logs-* artifact."
          cat "$RUNNER_TEMP/resp-fallback.json"
          exit 1
        fi
        URL=$(jq -r '.html_url' "$RUNNER_TEMP/resp-fallback.json")
        echo "review_url=$URL" >> "$GITHUB_OUTPUT"
        echo "Posted fallback review $URL with the findings in the body."

    # >>> Last, so everything above still happens. <<<
    # A denied tool call is how this job passed while reviewing nothing. Treat it as a
    # failure rather than a line in a log nobody reads.
    - name: Fail on permission denials
      if: always() && steps.stats.outputs.ran == 'true'
      shell: bash
      env:
        DENIALS: ${{ steps.stats.outputs.denials }}
        IS_ERROR: ${{ steps.stats.outputs.is_error }}
      run: |
        STATUS=0
        if [ "$DENIALS" != "0" ]; then
          echo "::error title=Claude review was denied $DENIALS tool call(s)::A denied Skill or Task means the review was starved or never ran, even though the agent exited cleanly. Add the missing tool to allowed_tools. See the claude-pr-review-logs-* artifact."
          STATUS=1
        fi
        if [ "$IS_ERROR" = "true" ]; then
          echo "::error title=Claude review reported an error::The run's result block has is_error=true."
          STATUS=1
        fi
        exit $STATUS
